name: Source and package checks

on:
  push:
    branches: [main, candidate/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.2.2 hatchling==1.27.0 ruff==0.16.10
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m build --no-isolation
      - run: python tools/verify_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.11'
        with:
          name: experimental-source-package
          path: dist/*
