[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auroraview-blender"
version = "0.1.0.dev0"
description = "Experimental Blender host scheduling and UI adapter for AuroraView Core"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/try-auroraview/auroraview-blender"
Issues = "https://github.com/try-auroraview/auroraview-blender/issues"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11", "tomli>=2.2.1; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/auroraview_blender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
